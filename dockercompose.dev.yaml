name: Job_analytics_app

services:
  redis:
    image: redis:latest
    container_name: redis

    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  redis-commander:
    image: rediscommander/redis-commander
    container_name: rediscommander

    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: app_worker
    container_name: celery_container
    command: ["celery", "-A", "celery_app.tasks","worker", "--loglevel=info","-E"]
    depends_on:
      - redis
    user: root

    volumes:
      - ./celery_app:/app/celery_app
      - ./skillner:/app/skillner
      - ./data_extraction/Websites:/app/data_extraction/Websites
      - ./spark_pipeline:/app/spark_pipeline
      - output:/app/data_extraction/scraping_output
      - logs:/var/log
      #These two last volumes are for running docker commands inside the container
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .docker.env
    environment:
      - PYTHONPATH=/app

  flower:
    build:
      context: ./celery_app
      dockerfile: Dockerfile.flower
    container_name: flower_container
    ports:
      - "5555:5555"
    # Broker-only mode — see the comment in celery_app/Dockerfile.flower.
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555", "--loglevel=info"]
    env_file:
      - .docker.env
    volumes:
      - ./celery_app:/app/celery_app
    depends_on:
      - redis
      - celery
  api:
    # Réutilise l'image du worker : c'est la seule qui embarque fastapi + uvicorn
    # (cf. pyproject.toml), le requirements.txt racine ne les contient pas.
    image: app_worker
    container_name: api_container
    command: ["uvicorn", "celery_app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - celery
    volumes:
      - ./celery_app:/app/celery_app
    env_file:
      - .docker.env
    environment:
      - PYTHONPATH=/app

  data_extraction:
    image: app_worker
    container_name: data_extraction_container
    volumes:
      - ./celery_app:/app/celery_app
      - ./data_extraction/Websites:/app/data_extraction/Websites
      - output:/app/data_extraction/scraping_output
      - logs:/var/log
    depends_on:
      - redis
      - celery

    command: ["python", "/app/data_extraction/web_scrape.py"]
    env_file:
      - .docker.env
    environment:
      - PYTHONPATH=/app
  minio:
    image: minio/minio

    container_name: minio
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9080:9080

    env_file:
      - .docker.env
    command: ["minio","server",'--console-address',":9080","/data"]

  postgres:
    image: postgres:latest

    ports:
      - "5432:5432"

    container_name: postgres

    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .docker.env.
    # Do NOT re-declare them under `environment:` with ${...} interpolation:
    # Compose resolves ${...} from a root .env or the shell, never from env_file,
    # so they would expand to empty strings and override the values below.
    env_file:
      - .docker.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      # $$ escapes to a literal $, so the container shell expands these at
      # runtime from env_file rather than Compose expanding them at parse time.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
    - 8080:8080

  spark_transform:
    build:
      context: ./spark_pipeline
      dockerfile: Dockerfile.spark
    container_name: spark_transform
    depends_on:
      - minio
    volumes:
      - ./spark_pipeline/transform_job.py:/opt/transform_job.py
      - /var/run/docker.sock:/var/run/docker.sock

    env_file:
      - .docker.env

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile.superset
    container_name: superset
    ports:
      - "8088:8088"
    env_file:
      - .docker.env
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/pythonpath
    depends_on:
      - postgres
    command: ["/bin/bash", "/app/setup.sh"]

  pipeline_loader:
   build:
    context: ./Postgres
    dockerfile: Dockerfile.pipeline
   container_name: pipeline_loader

   volumes:
    # Dockerfile.pipeline flattens ./Postgres into /app, so the source must be
    # mounted at /app (as the skillner service does) to shadow the copied code.
    - ./Postgres:/app
   env_file:
    - .docker.env
   depends_on:
    - postgres
    - minio
   restart: "no"

  enrechissement_processor:
    build:
      context: .
      dockerfile: enrechissement_process/Dockerfile.enrechissement
    container_name: enrechissement_processor
    depends_on:
      - minio
    volumes:
      - .:/app
    env_file:
      - .docker.env
    environment:
      - PYTHONPATH=/app

  
  skillner:
    build:
      context: ./skillner
      dockerfile: Dockerfile.skillner
    container_name: skillner_container
    env_file:
      - .docker.env
    volumes:
      - ./skillner:/app
    depends_on:
      - minio
    restart: "no"

  prediction:
    build:
      context: ./prediction
      dockerfile: Dockerfile.prediction
    container_name: prediction_container
    depends_on:
      - postgres
    volumes:
      - ./prediction:/app/prediction
    env_file:
      - .docker.env
    command: [ "python", "/app/prediction/manage_tables.py" ]


volumes:
  redis_data:
  minio_data:
  logs:
  output:
  postgres_data:
  superset_home:
